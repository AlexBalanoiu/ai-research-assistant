[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-assistant"
version = "0.1.0"
description = "Agent de cercetare autonom — Agentic AI Systems"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.36.2",
    "litellm>=1.84",
    "python-dotenv>=1.0.1",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]